<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fce6ea"/>
      <stop offset="1" stop-color="#f3bfc8"/>
    </linearGradient>
    <radialGradient id="center" cx="0.4" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.55" stop-color="#efc24a"/>
      <stop offset="1" stop-color="#d99a1e"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Greenery peeking out behind the daisy -->
    <path d="M256 268 C 196 300, 120 360, 70 452 C 160 452, 236 380, 256 268 Z" fill="#7f9f73"/>
    <path d="M256 268 C 316 300, 392 360, 442 452 C 352 452, 276 380, 256 268 Z" fill="#668a5d"/>
    <path d="M256 268 C 214 330, 150 386, 96 432" stroke="#ffffff" stroke-opacity="0.25" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M256 268 C 298 330, 362 386, 416 432" stroke="#ffffff" stroke-opacity="0.2" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Daisy -->
    <g transform="translate(256 236)">
      <g fill="#ffffff" stroke="#efcfd6" stroke-width="4">
        <ellipse cx="0" cy="-112" rx="36" ry="84"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(30)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(60)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(90)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(120)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(150)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(180)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(210)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(240)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(270)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(300)"/>
        <ellipse cx="0" cy="-112" rx="36" ry="84" transform="rotate(330)"/>
      </g>
      <circle r="66" fill="url(#center)"/>
      <g fill="#b9821a" fill-opacity="0.55">
        <circle cx="-14" cy="20" r="5"/>
        <circle cx="12" cy="26" r="5"/>
        <circle cx="30" cy="6" r="5"/>
        <circle cx="-30" cy="0" r="4.5"/>
        <circle cx="2" cy="40" r="4.5"/>
        <circle cx="26" cy="-18" r="4"/>
      </g>
    </g>
  </g>
</svg>
